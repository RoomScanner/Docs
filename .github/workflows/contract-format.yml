name: contract-format

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contract-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check API contract format
        run: python3 scripts/check_contract.py
